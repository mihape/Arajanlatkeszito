name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Smoke test Electron release mode
        run: npm run smoke:electron:release

      - name: Smoke test Electron demo mode
        run: npm run smoke:electron:demo

      - name: Build Windows installer
        run: npm run build:win

      - name: Smoke test packaged release app
        run: npm run smoke:packaged:release

      - name: Smoke test silent installer release app
        run: npm run smoke:installer:release

      - name: Smoke test installed app PDF export
        run: npm run smoke:installer:pdf

      - name: Smoke test installed app backup restart
        run: npm run smoke:installer:backup

      - name: Generate checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File -Filter "*.exe" | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash)  $($_.Name)" | Out-File -FilePath dist/CHECKSUMS.txt -Append -Encoding utf8
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nyilaszaro-windows-build
          path: |
            dist/*.exe
            dist/CHECKSUMS.txt

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/CHECKSUMS.txt
